name: 发布生产环境

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: sweet-memories-production
  queue: max
  cancel-in-progress: false

jobs:
  deploy:
    name: 检查并部署
    runs-on: ubuntu-24.04
    timeout-minutes: 170
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    env:
      SITE_ROOT: /var/www/huangjianfen.cn
      REMOTE_FRONTEND_ARCHIVE: /tmp/sweet-memories-${{ github.sha }}.tar.gz
      REMOTE_API_ARCHIVE: /tmp/sweet-memories-api-${{ github.sha }}.tar.gz
    steps:
      - name: 检出 Tag 对应代码
        id: checkout
        timeout-minutes: 2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 验证提交已经进入 main
        id: validate-main
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main --no-tags
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo 'Tag 指向的提交尚未进入 main，拒绝部署。' >&2
            exit 1
          fi

      - name: 安装 Node.js
        id: setup-node
        timeout-minutes: 3
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'

      - name: 安装项目指定的 pnpm
        id: install-pnpm
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          npm install --global pnpm@8.6.1
          test "$(pnpm --version)" = '8.6.1'

      - name: 安装 HEIF 工具
        id: install-heif
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libheif-examples
          heif-info --help >/dev/null
          heif-convert --help >/dev/null

      - name: 安装依赖
        id: install-dependencies
        timeout-minutes: 5
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        id: typecheck
        timeout-minutes: 5
        run: pnpm typecheck

      - name: 代码检查
        id: lint
        timeout-minutes: 5
        run: pnpm lint

      - name: 全量单元测试
        id: test
        timeout-minutes: 7
        run: pnpm test

      - name: API 和发布包测试
        id: test-api
        timeout-minutes: 8
        run: pnpm test:api

      - name: 部署脚本测试
        id: test-deploy
        timeout-minutes: 5
        run: pnpm test:deploy

      - name: 巡检脚本测试
        id: test-monitor
        timeout-minutes: 5
        run: pnpm test:monitor

      - name: 构建前端
        id: build-frontend
        timeout-minutes: 5
        run: pnpm build:frontend

      - name: 构建 API
        id: build-api
        timeout-minutes: 5
        run: pnpm build:api

      - name: 打包 API
        id: package-api
        timeout-minutes: 5
        shell: bash
        run: bash scripts/deploy/package-api.sh "$RUNNER_TEMP/api-release.tar.gz"

      - name: 打包前端
        id: package-frontend
        timeout-minutes: 2
        shell: bash
        run: tar -C dist -czf "$RUNNER_TEMP/release.tar.gz" .

      - name: 校验部署配置
        id: validate-config
        timeout-minutes: 1
        shell: bash
        env:
          ALIYUN_HOST: ${{ secrets.ALIYUN_HOST }}
          ALIYUN_SSH_PORT: ${{ secrets.ALIYUN_SSH_PORT }}
          ALIYUN_USER: ${{ secrets.ALIYUN_USER }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          set -euo pipefail
          : "${ALIYUN_HOST:?缺少 ALIYUN_HOST}"
          : "${ALIYUN_SSH_PORT:?缺少 ALIYUN_SSH_PORT}"
          : "${ALIYUN_USER:?缺少 ALIYUN_USER}"
          : "${PRODUCTION_URL:?缺少 PRODUCTION_URL}"
          if [[ ! "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'GITHUB_SHA 必须是 40 位小写十六进制字符。' >&2
            exit 1
          fi
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9][0-9A-Za-z.-]*$ ]]; then
            echo '发布 Tag 不是安全的版本名称。' >&2
            exit 1
          fi
          if [[ ! "$GITHUB_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo 'GitHub 仓库名称无效。' >&2
            exit 1
          fi
          if [[ ! "$ALIYUN_HOST" =~ ^[A-Za-z0-9.-]+$ ]]; then
            echo 'ALIYUN_HOST 只能包含字母、数字、点和连字符。' >&2
            exit 1
          fi
          if [[ ! "$ALIYUN_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]; then
            echo 'ALIYUN_USER 不是安全的用户名。' >&2
            exit 1
          fi
          if [[ ! "$ALIYUN_SSH_PORT" =~ ^[0-9]+$ ]]; then
            echo 'ALIYUN_SSH_PORT 必须是数字。' >&2
            exit 1
          fi
          if ((10#$ALIYUN_SSH_PORT < 1 || 10#$ALIYUN_SSH_PORT > 65535)); then
            echo 'ALIYUN_SSH_PORT 必须在 1 到 65535 之间。' >&2
            exit 1
          fi
          if [[ ! "$PRODUCTION_URL" =~ ^https://[^[:space:]]+$ ]]; then
            echo 'PRODUCTION_URL 必须是 HTTPS URL。' >&2
            exit 1
          fi

      - name: 发布不可变构建包
        id: publish-release
        timeout-minutes: 5
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api_archive="$RUNNER_TEMP/api-release.tar.gz"
          frontend_archive="$RUNNER_TEMP/release.tar.gz"
          api_name="sweet-memories-api-${GITHUB_SHA}.tar.gz"
          frontend_name="sweet-memories-frontend-${GITHUB_SHA}.tar.gz"
          api_sha256="$(sha256sum "$api_archive" | cut -d ' ' -f 1)"
          frontend_sha256="$(sha256sum "$frontend_archive" | cut -d ' ' -f 1)"
          verification_root="$(mktemp -d "$RUNNER_TEMP/release-verification.XXXXXX")"
          publish_root="$verification_root/publish"
          trap 'rm -rf -- "$verification_root"' EXIT HUP INT TERM
          mkdir -m 700 -- "$publish_root"
          ln -- "$api_archive" "$publish_root/$api_name"
          ln -- "$frontend_archive" "$publish_root/$frontend_name"

          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag \
              --title "$GITHUB_REF_NAME" \
              --notes "Automated production release for ${GITHUB_SHA}."
          fi

          ensure_asset() {
            local source_file="$1"
            local asset_name="$2"
            local expected_sha256="$3"
            local asset_root="$verification_root/verify-$asset_name"
            local downloaded actual_sha256

            if gh release view "$GITHUB_REF_NAME" --json assets \
              --jq '.assets[].name' | grep -Fqx -- "$asset_name"; then
              mkdir -m 700 -- "$asset_root"
              gh release download "$GITHUB_REF_NAME" \
                --pattern "$asset_name" --dir "$asset_root"
              downloaded="$asset_root/$asset_name"
              actual_sha256="$(sha256sum "$downloaded" | cut -d ' ' -f 1)"
              if [[ "$actual_sha256" != "$expected_sha256" ]]; then
                echo "Release 资产已存在但内容不匹配：$asset_name" >&2
                exit 1
              fi
              return
            fi

            gh release upload "$GITHUB_REF_NAME" "$source_file"
          }

          ensure_asset "$publish_root/$api_name" "$api_name" "$api_sha256"
          ensure_asset "$publish_root/$frontend_name" "$frontend_name" "$frontend_sha256"

          release_base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          {
            printf 'api_url=%s/%s\n' "$release_base" "$api_name"
            printf 'api_sha256=%s\n' "$api_sha256"
            printf 'frontend_url=%s/%s\n' "$release_base" "$frontend_name"
            printf 'frontend_sha256=%s\n' "$frontend_sha256"
          } >> "$GITHUB_OUTPUT"

      - name: 配置 SSH
        id: configure-ssh
        timeout-minutes: 1
        shell: bash
        env:
          ALIYUN_HOST: ${{ secrets.ALIYUN_HOST }}
          ALIYUN_SSH_PORT: ${{ secrets.ALIYUN_SSH_PORT }}
          ALIYUN_USER: ${{ secrets.ALIYUN_USER }}
          ALIYUN_SSH_PRIVATE_KEY: ${{ secrets.ALIYUN_SSH_PRIVATE_KEY }}
          ALIYUN_KNOWN_HOSTS: ${{ secrets.ALIYUN_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          : "${ALIYUN_SSH_PRIVATE_KEY:?缺少 ALIYUN_SSH_PRIVATE_KEY}"
          : "${ALIYUN_KNOWN_HOSTS:?缺少 ALIYUN_KNOWN_HOSTS}"
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$ALIYUN_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_deploy"
          printf '%s\n' "$ALIYUN_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/id_deploy" >/dev/null
          cat > "$HOME/.ssh/config" <<CONFIG
          Host production
            HostName $ALIYUN_HOST
            User $ALIYUN_USER
            Port $ALIYUN_SSH_PORT
            IdentityFile $HOME/.ssh/id_deploy
            UserKnownHostsFile $HOME/.ssh/known_hosts
            BatchMode yes
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ConnectTimeout 15
            ServerAliveInterval 15
            ServerAliveCountMax 3
          CONFIG

      - name: 防止线上前端版本倒退
        id: validate-live
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          active_release=''
          for attempt in 1 2 3; do
            if active_release="$(
              timeout 15s ssh production readlink -f -- "$SITE_ROOT/html"
            )"; then
              break
            fi
            if ((attempt < 3)); then
              echo "读取线上版本失败，第 $attempt 次重试。" >&2
              sleep 2
            fi
          done
          if [[ -z "$active_release" ]]; then
            echo '连续三次无法读取线上版本，拒绝上传发布产物。' >&2
            exit 1
          fi

          release_prefix="$SITE_ROOT/releases/"
          if [[ "$active_release" != "$release_prefix"* ]]; then
            echo '线上 html 未指向 releases 目录，拒绝部署。' >&2
            exit 1
          fi
          active_name="${active_release#"$release_prefix"}"
          if [[ -z "$active_name" || "$active_name" == */* ]]; then
            echo '线上 html 必须指向 releases 的直接子目录。' >&2
            exit 1
          fi
          if [[ "$active_name" =~ ^initial-[0-9]{8}T[0-9]{6}Z$ ]]; then
            exit 0
          fi
          if [[ ! "$active_name" =~ ^[0-9a-f]{40}$ ]]; then
            echo '线上版本名称既不是初始版本，也不是有效提交 SHA。' >&2
            exit 1
          fi

          active_sha="$active_name"
          if ! git cat-file -e "$active_sha^{commit}" 2>/dev/null; then
            echo '线上版本提交不在当前仓库历史中，拒绝部署。' >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$active_sha" "$GITHUB_SHA"; then
            echo '本次 Tag 早于或偏离线上版本，拒绝线上版本倒退。' >&2
            exit 1
          fi

      - name: 服务器下载 API 发布包
        id: upload-api
        timeout-minutes: 5
        shell: bash
        env:
          RELEASE_URL: ${{ steps.publish-release.outputs.api_url }}
          RELEASE_SHA256: ${{ steps.publish-release.outputs.api_sha256 }}
        run: |
          set -euo pipefail
          timeout 240s ssh production bash -s -- \
            "$REMOTE_API_ARCHIVE" "$RELEASE_URL" "$RELEASE_SHA256" <<'REMOTE'
          set -eu
          target="$1"
          url="$2"
          expected_sha256="$3"
          umask 077
          case "$url" in https://github.com/*) ;; *) exit 1 ;; esac
          case "$expected_sha256" in *[!0-9a-f]*|'') exit 1 ;; esac
          test "${#expected_sha256}" -eq 64
          test ! -e "$target"
          upload="$(mktemp "${target}.upload.XXXXXX")"
          trap 'rm -f -- "$upload"' EXIT HUP INT TERM
          curl --fail --location --proto '=https' --proto-redir '=https' \
            --tlsv1.2 --silent --show-error --connect-timeout 15 \
            --max-time 180 --retry 5 --retry-delay 2 --retry-max-time 220 \
            --retry-all-errors --output "$upload" "$url"
          actual_sha256="$(sha256sum "$upload" | cut -d ' ' -f 1)"
          test "$actual_sha256" = "$expected_sha256"
          chmod 600 "$upload"
          ln -- "$upload" "$target"
          rm -f -- "$upload"
          trap - EXIT HUP INT TERM
          REMOTE

      - name: 原子启用 API
        id: activate-api
        continue-on-error: true
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          timeout 240s ssh production sudo /usr/local/sbin/manage-sweet-memories-api activate "$GITHUB_SHA" "$REMOTE_API_ARCHIVE"

      - name: 读取相册数据源
        id: read-album-mode
        if: ${{ steps.activate-api.outcome == 'success' }}
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          album_mode="$(
            node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const config = JSON.parse(readFileSync('src/config/album-source.json', 'utf8'));
          if (
            config === null
            || typeof config !== 'object'
            || Array.isArray(config)
            || Object.keys(config).join('\0') !== 'mode'
            || (config.mode !== 'static' && config.mode !== 'api')
          ) {
            throw new Error('album source must be exact static or api JSON');
          }
          process.stdout.write(config.mode);
          NODE
          )"
          printf 'mode=%s\n' "$album_mode" >> "$GITHUB_OUTPUT"

      - name: 准备相册模式
        id: prepare-photo-mode
        if: ${{ steps.activate-api.outcome == 'success' }}
        timeout-minutes: 5
        shell: bash
        env:
          ALBUM_MODE: ${{ steps.read-album-mode.outputs.mode }}
        run: |
          set -euo pipefail
          timeout 120s ssh production sudo /usr/local/sbin/manage-sweet-memories-api cli uploads disable
          case "$ALBUM_MODE" in
            static)
              ;;
            api)
              timeout 120s ssh production sudo /usr/local/sbin/manage-sweet-memories-api cli migration check-ready
              ;;
            *)
              echo '相册数据源无效。' >&2
              exit 1
              ;;
          esac

      - name: 激活五张旧照片
        id: activate-legacy
        if: >-
          ${{ steps.activate-api.outcome == 'success' &&
          steps.prepare-photo-mode.outcome == 'success' &&
          steps.read-album-mode.outputs.mode == 'api' }}
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s ssh production sudo /usr/local/sbin/manage-sweet-memories-api cli migration activate

      - name: 服务器下载前端发布包
        id: upload-frontend
        if: >-
          ${{ steps.activate-api.outcome == 'success' &&
          steps.prepare-photo-mode.outcome == 'success' &&
          (steps.read-album-mode.outputs.mode == 'static' ||
          steps.activate-legacy.outcome == 'success') }}
        timeout-minutes: 5
        shell: bash
        env:
          RELEASE_URL: ${{ steps.publish-release.outputs.frontend_url }}
          RELEASE_SHA256: ${{ steps.publish-release.outputs.frontend_sha256 }}
        run: |
          set -euo pipefail
          timeout 240s ssh production bash -s -- \
            "$REMOTE_FRONTEND_ARCHIVE" "$RELEASE_URL" "$RELEASE_SHA256" <<'REMOTE'
          set -eu
          target="$1"
          url="$2"
          expected_sha256="$3"
          umask 077
          case "$url" in https://github.com/*) ;; *) exit 1 ;; esac
          case "$expected_sha256" in *[!0-9a-f]*|'') exit 1 ;; esac
          test "${#expected_sha256}" -eq 64
          test ! -e "$target"
          upload="$(mktemp "${target}.upload.XXXXXX")"
          trap 'rm -f -- "$upload"' EXIT HUP INT TERM
          curl --fail --location --proto '=https' --proto-redir '=https' \
            --tlsv1.2 --silent --show-error --connect-timeout 15 \
            --max-time 180 --retry 5 --retry-delay 2 --retry-max-time 220 \
            --retry-all-errors --output "$upload" "$url"
          actual_sha256="$(sha256sum "$upload" | cut -d ' ' -f 1)"
          test "$actual_sha256" = "$expected_sha256"
          chmod 600 "$upload"
          ln -- "$upload" "$target"
          rm -f -- "$upload"
          trap - EXIT HUP INT TERM
          REMOTE

      - name: 原子启用前端
        id: activate-frontend
        if: ${{ steps.upload-frontend.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          timeout 240s ssh production bash -s -- activate "$SITE_ROOT" "$GITHUB_SHA" "$REMOTE_FRONTEND_ARCHIVE" < scripts/deploy/manage-release.sh

      - name: 公网健康检查
        id: health-check
        if: ${{ always() && steps.activate-frontend.outcome != 'skipped' }}
        timeout-minutes: 8
        shell: bash
        env:
          ALBUM_MODE: ${{ steps.read-album-mode.outputs.mode }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          set -euo pipefail
          expected_release="$SITE_ROOT/releases/$GITHUB_SHA"
          active_release=''
          for attempt in 1 2 3; do
            if active_release="$(
              timeout 15s ssh production readlink -f -- "$SITE_ROOT/html"
            )"; then
              break
            fi
            if ((attempt < 3)); then
              echo "读取线上前端失败，第 $attempt 次重试。" >&2
              sleep 2
            fi
          done
          if [[ "$active_release" != "$expected_release" ]]; then
            echo '线上前端不是本次部署提交。' >&2
            exit 1
          fi

          site_origin="${PRODUCTION_URL%/}"
          timeout 120s curl --fail --silent --show-error --connect-timeout 10 --max-time 30 --retry 5 --retry-delay 2 --retry-max-time 120 --retry-all-errors "$site_origin/" >/dev/null
          if [[ "$ALBUM_MODE" == 'static' ]]; then
            exit 0
          fi
          if [[ "$ALBUM_MODE" != 'api' ]]; then
            echo '相册数据源无效。' >&2
            exit 1
          fi

          photos_file="$RUNNER_TEMP/public-photos.json"
          timeout 120s curl --fail --silent --show-error --connect-timeout 10 --max-time 30 --retry 5 --retry-delay 2 --retry-max-time 120 --retry-all-errors "$site_origin/api/photos" > "$photos_file"
          media_url="$(
            node --input-type=module - "$photos_file" "$site_origin" <<'NODE'
          import { readFileSync } from 'node:fs';

          const [photosFile, siteOrigin] = process.argv.slice(2);
          const photos = JSON.parse(readFileSync(photosFile, 'utf8'));
          const fixedIds = [
            '9a9a60f7-1edb-48ef-8ceb-5d9e188c2ab1',
            '58efb95e-2a98-45be-bbe4-acde6c34f7cd',
            'f83da4e8-d94e-4b8a-a725-36e2d1f931bf',
            'a15b8021-9842-4ed7-bd0f-9f98518a2d72',
            'c9608cd6-3480-43fb-84ab-623899262ff9',
          ];
          const calendarDate = /^\d{4}-\d{2}-\d{2}$/u;
          if (!Array.isArray(photos) || photos.length < fixedIds.length) {
            throw new Error('public API does not contain five photos');
          }
          for (let index = 0; index < photos.length; index += 1) {
            const current = photos[index];
            if (
              current === null
              || typeof current !== 'object'
              || typeof current.id !== 'string'
              || typeof current.capturedDate !== 'string'
              || !calendarDate.test(current.capturedDate)
            ) {
              throw new Error('public API photo shape is invalid');
            }
            const previous = photos[index - 1];
            if (previous !== undefined && previous.capturedDate > current.capturedDate) {
              throw new Error('public API photos are not ordered by captured date');
            }
          }
          const observedLegacyIds = photos
            .filter((photo) => fixedIds.includes(photo.id))
            .map((photo) => photo.id);
          if (JSON.stringify(observedLegacyIds) !== JSON.stringify(fixedIds)) {
            throw new Error('legacy photo IDs are missing, duplicated, or out of order');
          }
          const photo = photos[0];
          if (
            photo.sources === null
            || typeof photo.sources !== 'object'
            || photo.sources.fallback === null
            || typeof photo.sources.fallback !== 'object'
            || typeof photo.sources.fallback.url !== 'string'
          ) {
            throw new Error('first photo has no fallback media URL');
          }
          const mediaUrl = new URL(photo.sources.fallback.url, siteOrigin);
          if (
            mediaUrl.origin !== siteOrigin
            || !mediaUrl.pathname.startsWith('/media/')
            || mediaUrl.username !== ''
            || mediaUrl.password !== ''
            || mediaUrl.search !== ''
            || mediaUrl.hash !== ''
          ) {
            throw new Error('first media URL is not a safe same-origin media path');
          }
          process.stdout.write(mediaUrl.href);
          NODE
          )"
          media_status="$(
            timeout 120s curl --silent --show-error --connect-timeout 10 --max-time 30 --retry 5 --retry-delay 2 --retry-max-time 120 --retry-all-errors --output /dev/null --write-out '%{http_code}' "$media_url"
          )"
          [[ "$media_status" == 2[0-9][0-9] ]]

      - name: 公网检查后启用上传
        id: enable-uploads
        if: >-
          ${{ success() && !cancelled() &&
          steps.read-album-mode.outputs.mode == 'api' &&
          steps.activate-api.outcome == 'success' &&
          steps.prepare-photo-mode.outcome == 'success' &&
          steps.activate-legacy.outcome == 'success' &&
          steps.activate-frontend.outcome == 'success' &&
          steps.health-check.outcome == 'success' }}
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s ssh production sudo /usr/local/sbin/manage-sweet-memories-api cli uploads enable

      - name: 失败时先关闭上传
        id: disable-uploads
        if: >-
          ${{ always() && steps.activate-api.outcome != 'skipped' &&
          (failure() || cancelled() ||
          steps.activate-api.outcome == 'failure' ||
          steps.activate-api.outcome == 'cancelled' ||
          steps.read-album-mode.outcome == 'failure' ||
          steps.read-album-mode.outcome == 'cancelled' ||
          steps.prepare-photo-mode.outcome == 'failure' ||
          steps.prepare-photo-mode.outcome == 'cancelled' ||
          steps.activate-legacy.outcome == 'failure' ||
          steps.activate-legacy.outcome == 'cancelled' ||
          steps.upload-frontend.outcome == 'failure' ||
          steps.upload-frontend.outcome == 'cancelled' ||
          steps.activate-frontend.outcome == 'failure' ||
          steps.activate-frontend.outcome == 'cancelled' ||
          steps.health-check.outcome == 'failure' ||
          steps.health-check.outcome == 'cancelled' ||
          steps.enable-uploads.outcome == 'failure' ||
          steps.enable-uploads.outcome == 'cancelled') }}
        continue-on-error: true
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s ssh production sudo /usr/local/sbin/manage-sweet-memories-api cli uploads disable

      - name: 有条件回退前端
        id: rollback-frontend
        if: >-
          ${{ always() && steps.activate-frontend.outcome != 'skipped' &&
          (failure() || cancelled() ||
          steps.activate-frontend.outcome == 'failure' ||
          steps.activate-frontend.outcome == 'cancelled' ||
          steps.health-check.outcome == 'failure' ||
          steps.health-check.outcome == 'cancelled' ||
          steps.enable-uploads.outcome == 'failure' ||
          steps.enable-uploads.outcome == 'cancelled') }}
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          expected_release="$SITE_ROOT/releases/$GITHUB_SHA"
          for attempt in 1 2 3; do
            observed_release=''
            if observed_release="$(
              timeout 15s ssh production readlink -f -- "$SITE_ROOT/html"
            )" && [[ "$observed_release" != "$expected_release" ]]; then
              echo "已确认本次前端版本不再在线：$observed_release" >&2
              exit 0
            fi
            if ! timeout 30s ssh production bash -s -- rollback-if-current "$SITE_ROOT" "$GITHUB_SHA" < scripts/deploy/manage-release.sh; then
              echo "前端安全回退第 $attempt 次命令未确认成功。" >&2
            fi
            if observed_release="$(
              timeout 15s ssh production readlink -f -- "$SITE_ROOT/html"
            )" && [[ "$observed_release" != "$expected_release" ]]; then
              echo "已确认本次前端版本不再在线：$observed_release" >&2
              exit 0
            fi
            if ((attempt < 3)); then sleep 2; fi
          done
          echo '三次安全回退后仍无法确认本次前端版本已下线。' >&2
          exit 1

      - name: 有条件回退 API
        id: rollback-api
        if: >-
          ${{ always() && steps.activate-api.outcome != 'skipped' &&
          (failure() || cancelled() ||
          steps.activate-api.outcome == 'failure' ||
          steps.activate-api.outcome == 'cancelled' ||
          steps.read-album-mode.outcome == 'failure' ||
          steps.read-album-mode.outcome == 'cancelled' ||
          steps.prepare-photo-mode.outcome == 'failure' ||
          steps.prepare-photo-mode.outcome == 'cancelled' ||
          steps.activate-legacy.outcome == 'failure' ||
          steps.activate-legacy.outcome == 'cancelled' ||
          steps.upload-frontend.outcome == 'failure' ||
          steps.upload-frontend.outcome == 'cancelled' ||
          steps.activate-frontend.outcome == 'failure' ||
          steps.activate-frontend.outcome == 'cancelled' ||
          steps.health-check.outcome == 'failure' ||
          steps.health-check.outcome == 'cancelled' ||
          steps.enable-uploads.outcome == 'failure' ||
          steps.enable-uploads.outcome == 'cancelled') &&
          (steps.activate-frontend.outcome == 'skipped' ||
          steps.rollback-frontend.outcome == 'success') }}
        timeout-minutes: 11
        shell: bash
        run: |
          set -euo pipefail
          expected_release="/opt/sweet-memories-api/releases/$GITHUB_SHA"
          for attempt in 1 2 3; do
            observed_release=''
            if observed_release="$(
              timeout 15s ssh production readlink -f -- /opt/sweet-memories-api/current
            )" && [[ "$observed_release" != "$expected_release" ]]; then
              echo "已确认本次 API 版本不再在线：$observed_release" >&2
              exit 0
            fi
            if ! timeout 180s ssh production sudo /usr/local/sbin/manage-sweet-memories-api rollback-if-current "$GITHUB_SHA"; then
              echo "API 安全回退第 $attempt 次命令未确认成功。" >&2
            fi
            if observed_release="$(
              timeout 15s ssh production readlink -f -- /opt/sweet-memories-api/current
            )" && [[ "$observed_release" != "$expected_release" ]]; then
              echo "已确认本次 API 版本不再在线：$observed_release" >&2
              exit 0
            fi
            if ((attempt < 3)); then sleep 2; fi
          done
          echo '三次安全回退后仍无法确认本次 API 版本已下线。' >&2
          exit 1

      - name: 清理远程前端发布包
        id: archive-cleanup-frontend
        if: ${{ always() && steps.upload-frontend.outcome != 'skipped' }}
        continue-on-error: true
        timeout-minutes: 2
        run: timeout 30s ssh production rm -f -- "$REMOTE_FRONTEND_ARCHIVE"

      - name: 清理远程 API 发布包
        id: archive-cleanup-api
        if: ${{ always() && steps.upload-api.outcome != 'skipped' }}
        continue-on-error: true
        timeout-minutes: 2
        run: timeout 30s ssh production rm -f -- "$REMOTE_API_ARCHIVE"

      - name: 清理旧前端版本
        id: cleanup-frontend
        if: >-
          ${{ always() && steps.health-check.outcome == 'success' &&
          (steps.read-album-mode.outputs.mode == 'static' ||
          steps.enable-uploads.outcome == 'success') &&
          steps.activate-api.outcome == 'success' &&
          steps.activate-frontend.outcome == 'success' }}
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s ssh production bash -s -- cleanup "$SITE_ROOT" 5 < scripts/deploy/manage-release.sh

      - name: 清理旧 API 版本
        id: cleanup-api
        if: >-
          ${{ always() && steps.health-check.outcome == 'success' &&
          (steps.read-album-mode.outputs.mode == 'static' ||
          steps.enable-uploads.outcome == 'success') &&
          steps.activate-api.outcome == 'success' &&
          steps.activate-frontend.outcome == 'success' }}
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s ssh production sudo /usr/local/sbin/manage-sweet-memories-api cleanup 5

      - name: 报告不确定的激活失败
        id: fail-deployment
        if: >-
          ${{ always() && steps.activate-api.outcome != 'skipped' &&
          (failure() || cancelled() ||
          steps.activate-api.outcome == 'failure' ||
          steps.activate-api.outcome == 'cancelled' ||
          steps.read-album-mode.outcome == 'failure' ||
          steps.read-album-mode.outcome == 'cancelled' ||
          steps.prepare-photo-mode.outcome == 'failure' ||
          steps.prepare-photo-mode.outcome == 'cancelled' ||
          steps.activate-legacy.outcome == 'failure' ||
          steps.activate-legacy.outcome == 'cancelled' ||
          steps.upload-frontend.outcome == 'failure' ||
          steps.upload-frontend.outcome == 'cancelled' ||
          steps.activate-frontend.outcome == 'failure' ||
          steps.activate-frontend.outcome == 'cancelled' ||
          steps.health-check.outcome == 'failure' ||
          steps.health-check.outcome == 'cancelled' ||
          steps.enable-uploads.outcome == 'failure' ||
          steps.enable-uploads.outcome == 'cancelled' ||
          steps.rollback-frontend.outcome == 'failure' ||
          steps.rollback-frontend.outcome == 'cancelled' ||
          steps.rollback-api.outcome == 'failure' ||
          steps.rollback-api.outcome == 'cancelled') }}
        timeout-minutes: 1
        shell: bash
        env:
          FRONTEND_ROLLBACK_OUTCOME: ${{ steps.rollback-frontend.outcome }}
        run: |
          if [[ "$FRONTEND_ROLLBACK_OUTCOME" == 'failure' ||
            "$FRONTEND_ROLLBACK_OUTCOME" == 'cancelled' ]]; then
            echo '前端回退未确认，API 保持当前版本且上传保持关闭；需要人工检查前端和 API 指针。' >&2
          fi
          echo '发布激活命令失败，补偿步骤已执行。' >&2
          exit 1
