name: 发布生产环境

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: sweet-memories-production
  queue: max
  cancel-in-progress: false

jobs:
  deploy:
    name: 检查并部署
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    env:
      SITE_ROOT: /var/www/huangjianfen.cn
      REMOTE_ARCHIVE: /tmp/sweet-memories-${{ github.sha }}.tar.gz
    steps:
      - name: 检出 Tag 对应代码
        id: checkout
        timeout-minutes: 2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: 验证提交已经进入 main
        id: validate-main
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main --no-tags
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo 'Tag 指向的提交尚未进入 main，拒绝部署。' >&2
            exit 1
          fi

      - name: 安装 Node.js
        id: setup-node
        timeout-minutes: 3
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'

      - name: 安装项目指定的 pnpm
        id: install-pnpm
        timeout-minutes: 3
        run: |
          npm install --global pnpm@8.6.1
          test "$(pnpm --version)" = '8.6.1'

      - name: 安装依赖
        id: install-dependencies
        timeout-minutes: 5
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        id: typecheck
        timeout-minutes: 3
        run: pnpm typecheck

      - name: 代码检查
        id: lint
        timeout-minutes: 3
        run: pnpm lint

      - name: 单元测试
        id: test
        timeout-minutes: 5
        run: pnpm test

      - name: 部署脚本测试
        id: test-deploy
        timeout-minutes: 3
        run: pnpm test:deploy

      - name: 生产构建
        id: build
        timeout-minutes: 5
        run: pnpm build

      - name: 打包构建产物
        id: package
        timeout-minutes: 2
        shell: bash
        run: tar -C dist -czf "$RUNNER_TEMP/release.tar.gz" .

      - name: 校验部署配置
        id: validate-config
        timeout-minutes: 1
        shell: bash
        env:
          ALIYUN_HOST: ${{ secrets.ALIYUN_HOST }}
          ALIYUN_SSH_PORT: ${{ secrets.ALIYUN_SSH_PORT }}
          ALIYUN_USER: ${{ secrets.ALIYUN_USER }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          set -euo pipefail
          : "${ALIYUN_HOST:?缺少 ALIYUN_HOST}"
          : "${ALIYUN_SSH_PORT:?缺少 ALIYUN_SSH_PORT}"
          : "${ALIYUN_USER:?缺少 ALIYUN_USER}"
          : "${PRODUCTION_URL:?缺少 PRODUCTION_URL}"
          if [[ ! "$ALIYUN_HOST" =~ ^[A-Za-z0-9.-]+$ ]]; then
            echo 'ALIYUN_HOST 只能包含字母、数字、点和连字符。' >&2
            exit 1
          fi
          if [[ ! "$ALIYUN_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]; then
            echo 'ALIYUN_USER 不是安全的用户名。' >&2
            exit 1
          fi
          if [[ ! "$ALIYUN_SSH_PORT" =~ ^[0-9]+$ ]]; then
            echo 'ALIYUN_SSH_PORT 必须是数字。' >&2
            exit 1
          fi
          if ((10#$ALIYUN_SSH_PORT < 1 || 10#$ALIYUN_SSH_PORT > 65535)); then
            echo 'ALIYUN_SSH_PORT 必须在 1 到 65535 之间。' >&2
            exit 1
          fi
          if [[ ! "$PRODUCTION_URL" =~ ^https?://[^[:space:]]+$ ]]; then
            echo 'PRODUCTION_URL 必须是 http(s) URL。' >&2
            exit 1
          fi

      - name: 配置 SSH
        id: configure-ssh
        timeout-minutes: 1
        shell: bash
        env:
          ALIYUN_HOST: ${{ secrets.ALIYUN_HOST }}
          ALIYUN_SSH_PORT: ${{ secrets.ALIYUN_SSH_PORT }}
          ALIYUN_USER: ${{ secrets.ALIYUN_USER }}
          ALIYUN_SSH_PRIVATE_KEY: ${{ secrets.ALIYUN_SSH_PRIVATE_KEY }}
          ALIYUN_KNOWN_HOSTS: ${{ secrets.ALIYUN_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          : "${ALIYUN_SSH_PRIVATE_KEY:?缺少 ALIYUN_SSH_PRIVATE_KEY}"
          : "${ALIYUN_KNOWN_HOSTS:?缺少 ALIYUN_KNOWN_HOSTS}"
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$ALIYUN_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_deploy"
          printf '%s\n' "$ALIYUN_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/id_deploy" >/dev/null
          cat > "$HOME/.ssh/config" <<CONFIG
          Host production
            HostName $ALIYUN_HOST
            User $ALIYUN_USER
            Port $ALIYUN_SSH_PORT
            IdentityFile $HOME/.ssh/id_deploy
            UserKnownHostsFile $HOME/.ssh/known_hosts
            BatchMode yes
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ConnectTimeout 15
            ServerAliveInterval 15
            ServerAliveCountMax 3
          CONFIG

      - name: 防止线上版本倒退
        id: validate-live
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          active_release=''
          for attempt in 1 2 3; do
            if active_release="$(
              timeout 15s ssh production readlink -f -- "$SITE_ROOT/html"
            )"; then
              break
            fi
            if ((attempt < 3)); then
              echo "读取线上版本失败，第 $attempt 次重试。" >&2
              sleep 2
            fi
          done
          if [[ -z "$active_release" ]]; then
            echo '连续三次无法读取线上版本，拒绝上传发布产物。' >&2
            exit 1
          fi

          release_prefix="$SITE_ROOT/releases/"
          if [[ "$active_release" != "$release_prefix"* ]]; then
            echo '线上 html 未指向 releases 目录，拒绝部署。' >&2
            exit 1
          fi
          active_name="${active_release#"$release_prefix"}"
          if [[ -z "$active_name" || "$active_name" == */* ]]; then
            echo '线上 html 必须指向 releases 的直接子目录。' >&2
            exit 1
          fi
          if [[ "$active_name" =~ ^initial-[0-9]{8}T[0-9]{6}Z$ ]]; then
            exit 0
          fi
          if [[ ! "$active_name" =~ ^[0-9a-f]{40}$ ]]; then
            echo '线上版本名称既不是初始版本，也不是有效提交 SHA。' >&2
            exit 1
          fi

          active_sha="$active_name"
          if ! git cat-file -e "$active_sha^{commit}" 2>/dev/null; then
            echo '线上版本提交不在当前仓库历史中，拒绝部署。' >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$active_sha" "$GITHUB_SHA"; then
            echo '本次 Tag 早于或偏离线上版本，拒绝线上版本倒退。' >&2
            exit 1
          fi

      - name: 上传发布产物
        id: upload
        timeout-minutes: 5
        run: scp "$RUNNER_TEMP/release.tar.gz" "production:$REMOTE_ARCHIVE"

      - name: 原子启用新版本
        id: activate
        continue-on-error: true
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          ssh production bash -s -- activate "$SITE_ROOT" "$GITHUB_SHA" "$REMOTE_ARCHIVE" \
            < scripts/deploy/manage-release.sh

      - name: 公网健康检查并在失败时回退
        id: health-check
        if: ${{ always() && steps.activate.outcome != 'skipped' }}
        timeout-minutes: 5
        shell: bash
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          set -euo pipefail
          expected_release="$SITE_ROOT/releases/$GITHUB_SHA"

          read_live_release() {
            local attempt candidate
            for attempt in 1 2 3; do
              if candidate="$(
                timeout 15s ssh production readlink -f -- "$SITE_ROOT/html"
              )"; then
                active_release="$candidate"
                return 0
              fi
              if ((attempt < 3)); then
                echo "读取线上版本失败，第 $attempt 次重试。" >&2
                sleep 2
              fi
            done
            return 1
          }

          rollback_if_current() {
            local attempt observed_release
            for attempt in 1 2 3; do
              if ! timeout 15s ssh production bash -s -- rollback-if-current "$SITE_ROOT" "$GITHUB_SHA" \
                < scripts/deploy/manage-release.sh; then
                echo "安全回退第 $attempt 次命令未确认成功。" >&2
              fi

              if observed_release="$(
                timeout 15s ssh production readlink -f -- "$SITE_ROOT/html"
              )"; then
                if [[ "$observed_release" != "$expected_release" ]]; then
                  echo "已确认本次版本不再在线：$observed_release" >&2
                  return 0
                fi
                echo "本次版本仍在线，准备第 $attempt 次重试。" >&2
              else
                echo "安全回退后无法确认线上版本，第 $attempt 次重试。" >&2
              fi
              if ((attempt < 3)); then
                sleep 2
              fi
            done
            echo '三次安全回退后仍无法确认本次版本已下线。' >&2
            return 1
          }

          active_release=''
          if ! read_live_release; then
            echo '激活后连续三次无法读取线上版本，尝试安全回退。' >&2
            if ! rollback_if_current; then
              echo '无法确认安全回退结果，需要人工检查线上 html 链接。' >&2
            fi
            exit 1
          fi
          if [[ "$active_release" != "$expected_release" ]]; then
            echo '线上版本不是本次部署提交，拒绝继续部署。' >&2
            exit 1
          fi
          if timeout 120s curl --fail --silent --show-error \
            --connect-timeout 10 --max-time 30 \
            --retry 5 --retry-delay 2 --retry-max-time 120 \
            --retry-all-errors \
            "$PRODUCTION_URL" >/dev/null; then
            exit 0
          fi
          echo '公网健康检查失败，开始回退。' >&2
          if ! rollback_if_current; then
            echo '无法确认安全回退结果，需要人工检查线上 html 链接。' >&2
          fi
          exit 1

      - name: 清理远程发布包
        id: archive-cleanup
        if: ${{ always() && steps.upload.outcome != 'skipped' }}
        continue-on-error: true
        timeout-minutes: 2
        run: ssh production rm -f -- "$REMOTE_ARCHIVE"

      - name: 清理旧版本
        id: cleanup
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          ssh production bash -s -- cleanup "$SITE_ROOT" 5 \
            < scripts/deploy/manage-release.sh
