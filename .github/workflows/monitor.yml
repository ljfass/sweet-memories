name: 生产站点巡检

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: sweet-memories-production-monitor
  cancel-in-progress: false

jobs:
  monitor:
    name: 检查公网首页和构建资源
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      MONITOR_URL: ${{ vars.MONITOR_URL }}
    steps:
      - name: 检出巡检代码
        id: checkout
        timeout-minutes: 2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: 校验巡检配置
        id: validate-config
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          : "${MONITOR_URL:?缺少仓库变量 MONITOR_URL}"
          python3 scripts/monitor/extract-assets.py --validate-url "$MONITOR_URL"

      - name: 检查巡检脚本语法
        id: syntax
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/monitor/check-site.sh
          python3 -m py_compile scripts/monitor/extract-assets.py

      - name: 执行生产站点巡检
        id: monitor-site
        timeout-minutes: 5
        shell: bash
        run: bash scripts/monitor/check-site.sh "$MONITOR_URL"
